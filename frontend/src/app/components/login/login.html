<div class="auth-box">
  <div class="card">
    <h1>Willkommen zurück</h1>
    <p class="muted">Melde dich an, um zu handeln und zu spielen.</p>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <form (ngSubmit)="login()">
      <label>Benutzername</label>
      <input [(ngModel)]="username" name="username" autocomplete="username" />

      <label>Passwort</label>
      <input type="password" [(ngModel)]="password" name="password" autocomplete="current-password" />

      <button type="submit" [disabled]="loading">Einloggen</button>
    </form>

    <p class="switch">
      Noch kein Konto? <a routerLink="/register">Jetzt registrieren</a>
    </p>
  </div>
</div>
